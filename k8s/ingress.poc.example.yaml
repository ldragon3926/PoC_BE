apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: poc-app
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: poc.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: poc-app
                port:
                  number: 8080
