spring.application.name=PoC
# ========== MariaDB ==========
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/quan_ly_luong}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# ========== JWT ==========
security.jwt.secret=${SECURITY_JWT_SECRET:abc123456789abc123456789abc12345}
security.jwt.expiration-millis=${SECURITY_JWT_EXPIRATION_MILLIS:7200000}

# ========== Redis ==========
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms
spring.data.redis.repositories.enabled=false
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=2000ms
security.jwt.blacklist.prefix=${SECURITY_JWT_BLACKLIST_PREFIX:blacklist:token:}

# ========== Kafka ==========
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:poc-salary-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=org.example.poc.kafka.event
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true
spring.kafka.producer.acks=all
spring.kafka.producer.retries=5
spring.kafka.producer.properties.enable.idempotence=true

app.kafka.topics.salary-generate-requested=${APP_KAFKA_TOPIC_SALARY_GENERATE_REQUESTED:salary.generate.requested}
app.kafka.topics.salary-generate-requested-dlq=${APP_KAFKA_TOPIC_SALARY_GENERATE_REQUESTED_DLQ:salary.generate.requested.dlq}
app.kafka.topics.partitions=${APP_KAFKA_TOPIC_PARTITIONS:3}
app.kafka.topics.replicas=${APP_KAFKA_TOPIC_REPLICAS:1}
app.integration.kafka-connect-url=${APP_INTEGRATION_KAFKA_CONNECT_URL:http://localhost:8083}
app.integration.schema-registry-url=${APP_INTEGRATION_SCHEMA_REGISTRY_URL:http://localhost:8081}

# ========== Salary Job Cleanup ==========
app.salary-job.cleanup.enabled=${APP_SALARY_JOB_CLEANUP_ENABLED:true}
app.salary-job.cleanup.retention-days=${APP_SALARY_JOB_RETENTION_DAYS:60}
app.salary-job.cleanup.cron=${APP_SALARY_JOB_CLEANUP_CRON:0 30 2 * * *}
