spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
security.jwt.secret=test-secret-key-for-jwt-token-1234567890
security.jwt.expiration-millis=7200000
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=100ms
spring.data.redis.repositories.enabled=false
security.jwt.blacklist.prefix=blacklist:test:
spring.kafka.listener.auto-startup=false
app.kafka.topics.salary-generate-requested=salary.generate.requested.test
app.kafka.topics.salary-generate-requested-dlq=salary.generate.requested.dlq.test
app.salary-job.cleanup.enabled=false

